name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Chrome extension
        run: cd extension && npm install && npm run build:chrome
      - name: Package Chrome extension
        run: cd extension/dist && zip -r /tmp/extension-chrome.zip .

      - name: Build Firefox extension
        run: cd extension && npm run build:firefox
      - name: Package Firefox extension
        run: cd extension/dist && zip -r /tmp/extension-firefox.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: extension
          path: /tmp/extension-*.zip

  build-binary:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: openlink
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: openlink
          - target: x86_64-apple-darwin
            os: macos-13
            artifact: openlink
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: openlink.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf /tmp/openlink-${{ matrix.target }}.tar.gz ${{ matrix.artifact }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path target/${{ matrix.target }}/release/${{ matrix.artifact }} -DestinationPath C:/tmp/openlink-${{ matrix.target }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: |
            /tmp/openlink-${{ matrix.target }}.tar.gz
            C:/tmp/openlink-${{ matrix.target }}.zip

  release:
    needs: [build-extension, build-binary]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p /tmp/release
          find artifacts -type f -exec cp {} /tmp/release/ \;

      - uses: softprops/action-gh-release@v2
        with:
          files: /tmp/release/*
