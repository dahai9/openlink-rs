name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Chrome extension
        run: cd extension && npm install && npm run build:chrome
      - name: Package Chrome extension
        run: cd extension/dist && zip -r /tmp/extension-chrome.zip .

      - name: Build Firefox extension
        run: cd extension && npm run build:firefox
      - name: Package Firefox extension
        run: cd extension/dist && zip -r /tmp/extension-firefox.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: extension
          path: /tmp/extension-*.zip

  build-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ${{ github.workspace }}/openlink-${{ matrix.target }}.tar.gz openlink
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: openlink-${{ matrix.target }}.tar.gz

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - run: cargo build --release --target x86_64-unknown-linux-gnu
      - name: Package
        run: |
          cd target/x86_64-unknown-linux-gnu/release
          tar czf ${{ github.workspace }}/openlink-x86_64-unknown-linux-gnu.tar.gz openlink
      - uses: actions/upload-artifact@v4
        with:
          name: binary-x86_64-unknown-linux-gnu
          path: openlink-x86_64-unknown-linux-gnu.tar.gz

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - run: cargo build --release --target x86_64-pc-windows-msvc
      - name: Package
        shell: pwsh
        run: Compress-Archive -Path target/x86_64-pc-windows-msvc/release/openlink.exe -DestinationPath openlink-x86_64-pc-windows-msvc.zip
      - uses: actions/upload-artifact@v4
        with:
          name: binary-x86_64-pc-windows-msvc
          path: openlink-x86_64-pc-windows-msvc.zip

  release:
    needs: [build-extension, build-macos, build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p /tmp/release
          find artifacts -type f -exec cp {} /tmp/release/ \;

      - uses: softprops/action-gh-release@v2
        with:
          files: /tmp/release/*
